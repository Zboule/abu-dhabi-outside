# The Xcode project, generated: `xcodegen generate` (App.xcodeproj is not in git).
# Capacitor's template, plus the widget extension and its snapshot tests. CI order:
# npm run build:app, npx cap copy ios, xcodegen generate, npx cap update ios (see .github/workflows/ios.yml).
name: App
options:
  bundleIdPrefix: io.github.zboule
  deploymentTarget:
    iOS: "15.0"
packages:
  CapApp-SPM:
    path: CapApp-SPM
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: MKB8VRU5Y9
targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [public, capacitor.config.json, config.xml]
      - path: App/public
        type: folder
        buildPhase: resources
      - path: App/capacitor.config.json
        buildPhase: resources
      - path: App/config.xml
        buildPhase: resources
      - path: Widget/Shared/WidgetSettings.swift
    configFiles:
      Debug: ../debug.xcconfig
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.zboule.abudhabioutside]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zboule.abudhabioutside
        TARGETED_DEVICE_FAMILY: "1" # iPhone only (set per target: XcodeGen's target defaults say 1,2)
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # Release is signed by CI with the distribution certificate and the profiles from
      # scripts/asc_profiles.mjs (Xcode's automatic signing can't sign in from CI)
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Abu Dhabi Outside App Store
    dependencies:
      - package: CapApp-SPM
        product: CapApp-SPM
      - target: OutsideWidget
        embed: true
  OutsideWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Widget]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Abu Dhabi Outside
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.zboule.abudhabioutside]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zboule.abudhabioutside.widget
        TARGETED_DEVICE_FAMILY: "1" # iPhone only (set per target: XcodeGen's target defaults say 1,2)
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Abu Dhabi Outside Widget App Store
  WidgetSnapshots:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Widget/Shared, WidgetSnapshots]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.zboule.abudhabioutside.snapshots
        TARGETED_DEVICE_FAMILY: "1" # iPhone only (set per target: XcodeGen's target defaults say 1,2)
        GENERATE_INFOPLIST_FILE: YES
schemes:
  App:
    build:
      targets:
        App: all
  WidgetSnapshots:
    build:
      targets:
        WidgetSnapshots: [test]
    test:
      targets: [WidgetSnapshots]
