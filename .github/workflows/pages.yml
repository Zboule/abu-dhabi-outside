# Build and publish to GitHub Pages, and keep the station data fresh (hourly).
#
# Environment Agency Abu Dhabi (EAD) publishes hourly station readings through an API the
# browser can't call (no CORS). So every run first catches the mirror up (scripts/ead_sync.py)
# on the `data` branch, then builds the site with the mirror copied in at data/air/.
# The same run archives the SILAM and GEFS-Aerosols point forecasts (NetCDF and GRIB2 on S3,
# nothing a browser can read) and blends them (scripts/air_forecast.py) at forecast/ on that
# branch; the blend is published with the site at data/forecast/latest.json.
# The `data` branch holds a single commit, amended each run, so the repo doesn't grow.
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # hourly, after EAD posts the hour (GitHub may start it late). Schedules run only from the
    # default branch, which must stay `main` (it was `data` for a while, and nothing ran)
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write # push the refreshed station data
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the station data
        uses: actions/checkout@v4
        with:
          ref: data
          path: station-data

      - name: Catch the station data up from EAD
        run: EAD_DATA=station-data/air python3 scripts/ead_sync.py

      # fails soft: a source that is down is skipped by the script, and a crash here (a
      # dependency, S3) must not hold the station mirror back. The freshness check at the end
      # turns the run red when the blend has been missing for 12 hours
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-forecast.txt
      - name: Air forecasts (SILAM, GEFS-Aerosols, CAMS), archived and blended
        continue-on-error: true
        run: |
          pip install -q -r scripts/requirements-forecast.txt
          FORECAST_DATA=station-data/forecast python3 scripts/air_forecast.py

      - name: Save it (one amended commit on the data branch)
        working-directory: station-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no new readings"; exit 0; fi
          git commit --amend -m "EAD station readings and air forecasts, mirrored (updated $(date -u +%FT%TZ))"
          git push --force origin HEAD:data

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish the station data and the particle forecast blend with the site
        run: |
          mkdir -p dist/data/forecast
          cp -r station-data/air dist/data/air
          cp station-data/forecast/latest.json dist/data/forecast/ 2>/dev/null || echo "no blend to publish"

      # each forecast hour's air levels, kept for the next run so an hour at a limit doesn't flip
      # every hour (scripts/air_hold.mts, starting from the published copy). Before the widget feed,
      # which rates with them too. If it fails, the next run just starts from the plain limits
      - name: Air levels held for the next run
        continue-on-error: true
        run: |
          AIR_DATA=station-data/air node scripts/air_hold.mts station-data/forecast/held.json
          cp station-data/forecast/held.json dist/data/forecast/

      # the phone widgets' feed (scripts/widget_feed.mts). A deploy replaces the whole site, so
      # when it can't be made the last published one ships again, and the run turns red below
      - name: Widget feed
        id: feed
        run: |
          if ! AIR_DATA=station-data/air node scripts/widget_feed.mts dist/data/widget/v1.json; then
            echo "failed=1" >> "$GITHUB_OUTPUT"
            mkdir -p dist/data/widget
            curl -fsS https://zboule.github.io/abu-dhabi-outside/data/widget/v1.json -o dist/data/widget/v1.json || true
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

      # after the deploy, so a stale mirror still ships the site, but the run turns red (and
      # GitHub emails) when no station reading is newer than 6 hours
      - name: Station data is fresh
        run: EAD_DATA=station-data/air python3 scripts/ead_sync.py --check-fresh 6
      - name: Particle forecast blend is fresh
        run: FORECAST_DATA=station-data/forecast python3 scripts/air_forecast.py --check-fresh 12
      - name: Widget feed was made
        if: steps.feed.outputs.failed == '1'
        run: exit 1
