# The iOS app: build it, render the widgets and screenshot the app on a simulator, then (on main)
# archive, sign and upload it to TestFlight.
# Artifacts: "ios-screens", PNGs of every widget size and of the app.
# Signing is Xcode's automatic signing driven by an App Store Connect API key (secrets ASC_KEY_P8,
# ASC_KEY_ID, ASC_ISSUER_ID; Admin role, so it can create the app IDs, App Group, certificates and
# profiles it needs). The build number is the run number, so every upload is a new TestFlight build.
name: iOS

on:
  push:
    branches: [main]
    paths: [ios/**, src/**, contract/**, package.json, package-lock.json, capacitor.config.ts, .env.app, .github/workflows/ios.yml]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:app

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          npx cap copy ios
          (cd ios/App && xcodegen generate)
          npx cap update ios
          xcodebuild -version

      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          rt = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in rt if "iOS" in k), key=lambda k: [int(x) for x in k.rsplit("iOS-", 1)[1].split("-")])
          for k in reversed(ios):
              phones = [d for d in rt[k] if d["name"].startswith("iPhone") and "Pro" in d["name"] and "Max" not in d["name"]] or [d for d in rt[k] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[-1]["udid"]); break')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$udid"

      - name: Build the app
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -50; tail -15 build.log; exit 1; }
          grep -E "\.swift:[0-9]+:[0-9]+: warning:" build.log | sort -u | head -30 || true

      - name: Widget tests and renders
        working-directory: ios/App
        run: |
          ok=0
          TEST_RUNNER_SNAPSHOT_DIR="$GITHUB_WORKSPACE/screens/widgets" xcodebuild test -project App.xcodeproj -scheme WidgetSnapshots \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build CODE_SIGNING_ALLOWED=NO > test.log 2>&1 || ok=1
          grep -E "error:|Test Case .*(passed|failed|skipped)|Executed|\*\* TEST" test.log | sort -u | head -60
          exit $ok

      - name: Screenshot the app
        run: |
          id=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$id" || true
          xcrun simctl bootstatus "$id" -b
          xcrun simctl status_bar "$id" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$id" ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$id" io.github.zboule.abudhabioutside
          sleep 20
          mkdir -p screens
          xcrun simctl io "$id" screenshot screens/app.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screens
          path: screens
          if-no-files-found: warn

  testflight:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:app

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          npx cap copy ios
          (cd ios/App && xcodegen generate)
          npx cap update ios

      - name: API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/key.p8"

      - name: Archive
        working-directory: ios/App
        run: |
          xcodebuild archive -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" > archive.log 2>&1 \
            || { grep -E "error:|requires a provisioning|No profiles|App Group" archive.log | sort -u | head -40; tail -20 archive.log; exit 1; }
          echo "archived build ${{ github.run_number }}"

      - name: Upload to TestFlight
        working-directory: ios/App
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" > export.log 2>&1 \
            || { grep -iE "error|cannot be found|no suitable application records" export.log | sort -u | head -40; tail -20 export.log; exit 1; }
          grep -iE "upload|success" export.log | tail -5

      - name: Forget the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
