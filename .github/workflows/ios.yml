# The iOS app: build it, render the widgets and screenshot the app on a simulator, then (on main)
# archive, sign and upload it to TestFlight.
# Artifacts: "ios-screens", PNGs of every widget size and of the app.
# Signing is manual (Xcode's automatic signing can't sign in to Apple from CI): the Apple Distribution
# certificate is a secret (DIST_CERT_P12, DIST_CERT_PASSWORD; Apple id in DIST_CERT_ID below), the
# App Store profiles are made or fetched through the API (scripts/asc_profiles.mjs) with the team API
# key (ASC_KEY_P8, ASC_KEY_ID, ASC_ISSUER_ID), which also uploads the build. The build number is the
# run number, so every upload is a new TestFlight build.
name: iOS

on:
  push:
    branches: [main]
    paths: [ios/**, src/**, contract/**, package.json, package-lock.json, capacitor.config.ts, .env.app, .github/workflows/ios.yml]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:app

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          npx cap copy ios
          (cd ios/App && xcodegen generate)
          npx cap update ios
          xcodebuild -version

      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          rt = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in rt if "iOS" in k), key=lambda k: [int(x) for x in k.rsplit("iOS-", 1)[1].split("-")])
          for k in reversed(ios):
              phones = [d for d in rt[k] if d["name"].startswith("iPhone") and "Pro" in d["name"] and "Max" not in d["name"]] or [d for d in rt[k] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[-1]["udid"]); break')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$udid"

      - name: Build the app
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -50; tail -15 build.log; exit 1; }
          grep -E "\.swift:[0-9]+:[0-9]+: warning:" build.log | sort -u | head -30 || true

      - name: Widget tests and renders
        working-directory: ios/App
        run: |
          ok=0
          TEST_RUNNER_SNAPSHOT_DIR="$GITHUB_WORKSPACE/screens/widgets" xcodebuild test -project App.xcodeproj -scheme WidgetSnapshots \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build CODE_SIGNING_ALLOWED=NO > test.log 2>&1 || ok=1
          grep -E "error:|Test Case .*(passed|failed|skipped)|Executed|\*\* TEST" test.log | sort -u | head -60
          exit $ok

      - name: Screenshot the app
        run: |
          id=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$id" || true
          xcrun simctl bootstatus "$id" -b
          xcrun simctl status_bar "$id" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$id" ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$id" io.github.zboule.abudhabioutside
          sleep 20
          mkdir -p screens
          xcrun simctl io "$id" screenshot screens/app.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screens
          path: screens
          if-no-files-found: warn

  testflight:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      DIST_CERT_ID: 9G5W52FRQN # Apple Distribution: Jordane CURE, expires 2027-10-27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:app

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          npx cap copy ios
          (cd ios/App && xcodegen generate)
          npx cap update ios

      - name: API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          # altool looks for the key in ~/.appstoreconnect/private_keys
          dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$dir"
          printf '%s\n' "$ASC_KEY_P8" > "$dir/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$dir/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=${{ secrets.ASC_ISSUER_ID }}" >> "$GITHUB_ENV"

      - name: Check the key, install the distribution certificate and the profiles
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          node scripts/asc_check.mjs
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw=$(openssl rand -base64 24)
          echo "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/dist.p12" -k "$kc" -P "$DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$kc"
          node scripts/asc_profiles.mjs

      - name: Archive
        working-directory: ios/App
        run: |
          xcodebuild archive -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} > archive.log 2>&1 \
            || { grep -E "error:" archive.log | sort -u | head -40; tail -20 archive.log; exit 1; }
          echo "archived build ${{ github.run_number }}"

      - name: Export the .ipa
        working-directory: ios/App
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" > export.log 2>&1 \
            || { grep -iE "error" export.log | sort -u | head -40; tail -20 export.log; exit 1; }
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        run: |
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa)
          if xcrun --find altool > /dev/null 2>&1; then
            xcrun altool --upload-app -f "$ipa" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal
          else
            brew install fastlane
            printf '{"key_id":"%s","issuer_id":"%s","key_filepath":"%s"}' "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$ASC_KEY_PATH" > "$RUNNER_TEMP/asc.json"
            fastlane pilot upload --ipa "$ipa" --api_key_path "$RUNNER_TEMP/asc.json" --skip_waiting_for_build_processing true
          fi

      - name: Forget the key and the certificate
        if: always()
        run: |
          rm -rf "$HOME/.appstoreconnect" "$RUNNER_TEMP/asc.json" "$RUNNER_TEMP/dist.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
